# Build and publish an immutable Workspc candidate without changing Cloud Run
# traffic. Promotion is a separate, explicit release step.
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west2
  _REPOSITORY: privydoc
  _IMAGE: doc-workspace
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_ANON_KEY: ''
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
      - --build-arg
      - VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg
      - VITE_SUPABASE_ANON_KEY=${_VITE_SUPABASE_ANON_KEY}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA']
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$COMMIT_SHA
