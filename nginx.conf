# PrivyDoc Workspace — nginx site config for the Cloud Run container.
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    # Cloud Run's default $PORT.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the wire.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx add_header inheritance gotcha: a location block that declares
    # its own add_header discards ALL inherited ones, so the security set
    # is repeated in every location that adds a Cache-Control header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vite emits content-hashed filenames under /assets/ — safe to cache
    # forever; a new deploy produces new hashes.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The HTML shell must never be cached — it is what points at the
    # latest hashed bundle.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (the app uses HashRouter, but this also covers any
    # future switch to path-based routing and direct deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
