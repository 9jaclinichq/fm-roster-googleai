  <!-- Monogram, centered well within the maskable safe-zone circle -->
  <text x="256" y="290" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="200" letter-spacing="-4" fill="#ffffff">PD</text>

  <!-- "Intelligent workspace" sparkle accent, same 4-point twinkle motif
       used throughout the app's own AI-feature UI (lucide-react Sparkles) -->
